[project]
name = "documind-ai"
version = "0.1.0"
description = "Enterprise document knowledge platform with permission-aware RAG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.6,<6",
  "fastapi>=0.135,<1",
  "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api", "apps/worker", "packages", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: local component integration with an actual worker",
]
