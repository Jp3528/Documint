name: documind

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: ${DOCUMIND_DB_PASSWORD:-documind-local-only}
    ports:
      - "127.0.0.1:${DOCUMIND_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${DOCUMIND_REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: infra/minio
    image: documind-minio:7aac2a2
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DOCUMIND_S3_ACCESS_KEY:-documind-local}
      MINIO_ROOT_PASSWORD: ${DOCUMIND_S3_SECRET_KEY:-documind-local-secret-only}
    ports:
      - "127.0.0.1:${DOCUMIND_S3_PORT:-59000}:9000"
      - "127.0.0.1:${DOCUMIND_S3_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  minio_data:
