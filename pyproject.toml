[project]
name = "documint"
version = "0.1.0"
description = "Enterprise document knowledge platform with permission-aware RAG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<2",
  "boto3>=1.42,<2",
  "celery[redis]>=5.6,<6",
  "defusedxml>=0.7.1,<1",
  "email-validator>=2.3,<3",
  "fastapi>=0.135,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.12,<3",
  "pyjwt>=2.10,<3",
  "pypdf>=6,<10",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.41,<1",
]

[dependency-groups]
corpus = [
    "reportlab>=4.4,<5",
]
dev = [
  "boto3-stubs[s3]>=1.42,<2",
  "httpx2>=2.13.1",
  "mypy>=1.19,<2",
  "pypdf>=6,<10",
  "pytest>=9,<10",
  "python-docx>=1.2,<2",
  "ruff>=0.15,<1",
  "types-defusedxml>=0.7.0.20260504",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api", "apps/worker", "packages", "scripts", "tests", "migrations", "evals"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: local component integration with an actual worker",
  "infrastructure: opt-in integration with real PostgreSQL, Redis and MinIO",
]
